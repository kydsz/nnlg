server {
    listen 80;
    server_name localhost _;

    client_max_body_size 50M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 已哈希的静态资源可长期缓存（文件名带内容哈希，变更即换名）。
    # 注意：正则必须限定在 /assets/ 下。正则 location 的优先级高于普通前缀
    # location，若不限定，/api/v1/files/xxx/现场照片.png 会被当成前端静态资源
    # 去 /usr/share/nginx/html 下查找而 404——表现为评教记录图片预览加载失败，
    # 而 PDF 导出（URL 无图片扩展名）仍正常。
    location ~* ^/assets/.*\.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口始终重新校验，避免浏览器缓存旧 index.html 导致"改了没生效"
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ^~：命中 /api 前缀后不再尝试正则 location，保证带图片/附件扩展名的
    # 接口请求（如 /api/v1/files/.../现场照片.png）始终反代到后端。
    location ^~ /api {
        proxy_pass http://backend:8000/api;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ^~ /uploads {
        proxy_pass http://backend:8000/uploads;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查（前端容器存活探针）
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}